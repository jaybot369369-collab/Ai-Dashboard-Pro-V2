<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JP Dashboard 3</title>
<script>
/* Day or night, and the text size, before the first paint — no white flash,
   no size jump. Inline and first on purpose: needs no network, so the theme
   is still right if pearl-boot.js below ever fails to arrive. */
(function () {
  try {
    var R = document.documentElement, t = localStorage.getItem('jp3_theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
    R.setAttribute('data-theme', t);
    R.setAttribute('data-font', 'd');
    R.setAttribute('data-size', localStorage.getItem('jp3_size') || 'm');
  } catch (e) {}
})();
</script>
<!-- pearl.css loads LAST so its tokens win. -->
<script src="js/pearl-boot.js?v=2"></script>
<link rel="stylesheet" href="css/desk.css?v=15">
<link rel="stylesheet" href="css/ported.css?v=9">
<link rel="stylesheet" href="css/pearl.css?v=4">
</head>
<body>

<!-- Mobile only: opens the sidebar as a drawer. Hidden above 860px. -->
<button class="nav-open" id="navOpen" aria-label="Menu" aria-expanded="false" aria-controls="nav">
  <span></span><span></span><span></span>
</button>
<div class="nav-scrim" id="navScrim"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-txt"><b>Dashboard 3.3</b></span></div>
    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1 id="headTitle">Loading…</h1>
        <p class="sub" id="headSub"></p>
      </div>
      <!-- Static, not injected: app.js binds these at start-up and it is the
           only thing that knows to redraw the canvas charts on a theme change.
           pearl-boot.js sees them already built and leaves them alone. -->
      <div class="head-right" data-pearl-controls>
        <div class="size-tog" id="sizeTog" title="Text size">
          <button data-size-set="s">A</button>
          <button data-size-set="m">A</button>
          <button data-size-set="l">A</button>
          <button data-size-set="xl">A</button>
        </div>
        <div class="theme-tog" id="themeTog">
          <button data-theme-set="day">Day</button>
          <button data-theme-set="night">Night</button>
        </div>
      </div>
    </header>

    <div id="view"></div>
  </main>
</div>

<script src="js/lib/chart.umd.min.js"></script>
<script src="js/integrations/r2.js?v=8"></script>
<script src="js/integrations/telegram.js?v=8"></script>
<script src="js/integrations/server_save.js?v=8"></script>
<script src="js/store.js?v=9"></script>
<script src="js/stats.js?v=8"></script>
<script src="js/ui.js?v=8"></script>
<script src="js/compat.js?v=8"></script>
<script src="js/backup.js?v=7"></script>
<script src="js/pages/desk.js?v=15"></script>
<script src="js/pages/tradelog.js?v=10"></script>
<script src="js/pages/performance.js?v=9"></script>
<script src="js/pages/coach.js?v=9"></script>
<script src="js/pages/context.js?v=9"></script>
<script src="js/pages/calendar.js?v=21"></script>
<script src="js/pages/level2.js?v=9"></script>
<script src="js/pages/radar.js?v=9"></script>
<script src="js/pages/playbook.js?v=9"></script>
<script src="js/pages/tendencies.js?v=9"></script>
<script src="js/pages/settings.js?v=14"></script>
<script src="js/app.js?v=10"></script>
<script>
/* Mobile drawer. Above 860px the button is display:none and none of this fires. */
(function () {
  var btn = document.getElementById('navOpen'),
      scrim = document.getElementById('navScrim'),
      body = document.body;

  function set(on) {
    body.classList.toggle('nav-on', on);
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  btn.addEventListener('click', function () {
    set(!body.classList.contains('nav-on'));
  });
  scrim.addEventListener('click', function () { set(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') set(false);
  });
  /* nav is built by app.js, so listen on the container */
  document.getElementById('nav').addEventListener('click', function (e) {
    if (e.target.closest('.nav-item')) set(false);
  });
  /* dragging the window back over 860px should not leave it stuck open */
  matchMedia('(min-width:861px)').addEventListener('change', function (m) {
    if (m.matches) set(false);
  });
})();
</script>
</body>
</html>
